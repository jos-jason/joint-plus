name: joint_plus
description: "Joint+ — criteria-based physical therapy progressions."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  share_plus: ^13.3.1
  timezone: ^0.11.2
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

# App icon. Source + generator: tool/make_icon.py → assets/icon/.
# Regenerate platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/programs/
    - assets/illustrations/
